<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Same proportions as the in-app mark (AppLogo): ink tile, paper glyph,
       flipped in dark mode so it never disappears on a dark tab or page. -->
  <style>
    .tile { fill: #18181b; }
    .glyph { stroke: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f4f4f5; }
      .glyph { stroke: #0c0c0d; }
    }
  </style>
  <rect class="tile" width="48" height="48" rx="12"/>
  <g class="glyph" transform="translate(10 10) scale(1.1667)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
    <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
    <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
    <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
  </g>
</svg>
